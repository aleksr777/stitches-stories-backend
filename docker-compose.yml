services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: stitches_stories
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_development_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stitches_stories"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres_data:
