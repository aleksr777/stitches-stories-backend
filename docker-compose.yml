services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: ${DB_NAME:-stitches_stories}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_development_only}
    ports: ['127.0.0.1:${DB_PORT:-15432}:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2
    ports: ['127.0.0.1:${REDIS_PORT:-16379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-18025}:8025'
volumes:
  postgres_data:
