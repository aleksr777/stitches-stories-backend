name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: app_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSL: false
      DB_SSL_REJECT_UNAUTHORIZED: true
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app_test
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: ReleaseAuditPassword123!
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_FROM: studio@stitches.test
      MAILPIT_WEB_PORT: 8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Local setup regression tests
        run: npm run test:setup

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: TypeScript unused-symbol audit
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters --pretty false

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Migration smoke test on clean PostgreSQL
        run: npm run migration:run

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Start the application and verify the store API
        run: |
          npm run setup:local
          npm run seed:demo
          node dist/src/main.js > /tmp/stitches-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          npm run test:smoke || { cat /tmp/stitches-smoke.log; exit 1; }
